{% set name = "aiodns" %}
{% set version = "3.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 11264edbab51896ecf546c18eb0dd56dff0428c6aa6d2cd87e643e07300eb310

build:
  skip: true  # [py<39]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - wheel
  run:
    - python
    - pycares >=4.9.0

test:
  source_files:
    - tests/
  imports:
    - aiodns
  commands:
    - pip check
    - pytest tests/ -v --tb=short --asyncio-mode=auto
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - pytest-cov

about:
  home: https://github.com/saghul/aiodns
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Simple DNS resolver for asyncio
  description: |
    aiodns provides a simple way for doing asynchronous DNS resolutions using
    pycares.
  doc_url: https://github.com/saghul/aiodns
  dev_url: https://github.com/saghul/aiodns

extra:
  recipe-maintainers:
    - CurtLH
